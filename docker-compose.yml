version: "3.9"

services:
  api:
    build: .
    command: python src/server.py
    ports:
      - "5001:5001"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build: .
    command: streamlit run src/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./docs:/app/docs
    depends_on:
      - api
